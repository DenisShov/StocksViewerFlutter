name: stocks_viewer_flutter
description: "StocksViewer - a Flutter port of the StocksViewer Android application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  dio: ^5.8.0+1
  fpdart: ^1.2.0
  equatable: ^2.0.7
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  syncfusion_flutter_charts: ^34.1.32
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.42
  url_launcher: ^6.3.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.15
  riverpod_lint: ^3.0.3
  custom_lint: ^0.8.1

  drift_dev: ^2.31.0
  json_serializable: ^6.9.5
  glados: ^1.1.7

flutter:
  uses-material-design: true
  generate: true
